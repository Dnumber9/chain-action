<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* Fixed-size social card (1200x630). Not used by any visited page — only
     screenshotted by scripts/generate-og.mjs. Reuses theme.css's color/font
     tokens so cards match the site, but lays out on its own fixed canvas. */
  html,body{background:var(--paper)}
  #card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px 68px;border:14px solid var(--ink);
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 100%,
      var(--paper);
  }
  #eyebrow{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;gap:16px;font-family:"IBM Plex Mono",monospace}
  #title{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
    font-size:64px;line-height:1.02;letter-spacing:-.03em;color:var(--ink);margin:22px 0 0;max-width:1000px}
  #tagline{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--win);margin-top:16px;font-weight:600}
  #stats{display:flex;gap:48px;font-family:"IBM Plex Mono",monospace}
  #stats .stat{display:flex;flex-direction:column;gap:6px}
  #stats .k{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  #stats .v{font-size:34px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  #brand{position:absolute;bottom:64px;right:68px;font-family:"IBM Plex Mono",monospace;
    font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="card">
  <div>
    <div id="eyebrow"></div>
    <div id="title"></div>
    <div id="tagline"></div>
  </div>
  <div style="display:flex;align-items:flex-end;justify-content:space-between">
    <div id="stats"></div>
  </div>
  <div id="brand">Chain Teardowns</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const eyebrowParts = [q.get("chain"), q.get("ticker"), q.get("date")].filter(Boolean);
  document.getElementById("eyebrow").innerHTML =
    eyebrowParts.map(p => `<span>${p}</span>`).join('<span>·</span>');
  document.getElementById("title").textContent = q.get("title") || "";
  document.getElementById("tagline").textContent = q.get("tagline") || "";
  const stats = q.getAll("stat"); // each as "Label:Value"
  document.getElementById("stats").innerHTML = stats.map(s => {
    const [k, v] = s.split(":");
    return `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  }).join("");
</script>
</body>
</html>
